databases:
  - name: vault-ai-db
    databaseName: vault_ai
    user: vault_admin
    plan: free
    region: oregon

services:
  - type: web
    name: vault-ai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate --schema=prisma/schema.prisma && npm run build
    startCommand: npx prisma migrate deploy --schema=prisma/schema.prisma && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      - key: DATABASE_URL
        fromDatabase:
          name: vault-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: TELEGRAM_MODE
        value: real
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: AI_PROVIDER
        value: local
      - key: MAX_FILE_SIZE_BYTES
        value: "2097152000"
